<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>AeroMint Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <div class="eyebrow">AEROMINT</div>
        <h1>Admin Task Panel</h1>
        <p>Manage tasks, rewards and task status.</p>
      </div>
      <button id="refreshBtn" class="btn secondary">Refresh</button>
    </header>

    <section id="message" class="message hidden" aria-live="polite"></section>

    <section class="panel">
      <div class="panel-title">
        <div>
          <h2 id="formTitle">Add Task</h2>
          <p>Create a new task for AeroMint users.</p>
        </div>
        <button id="cancelEditBtn" class="btn ghost hidden">Cancel edit</button>
      </div>

      <form id="taskForm" class="task-form">
        <input type="hidden" id="taskId">

        <label>
          <span>Task title</span>
          <input id="title" required maxlength="120" placeholder="Example: Telegram Task">
        </label>

        <label>
          <span>Description</span>
          <textarea id="description" maxlength="500" placeholder="Short task description"></textarea>
        </label>

        <div class="grid-2">
          <label>
            <span>Reward (AMT)</span>
            <input id="reward" type="number" min="0.01" max="100000" step="0.01" required value="0.20">
          </label>

          <label>
            <span>Category</span>
            <select id="category">
              <option value="social">Social</option>
              <option value="daily">Daily</option>
              <option value="special">Special</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label>
            <span>Verification type</span>
            <select id="verificationType">
              <option value="none">None / manual claim</option>
              <option value="telegram">Telegram</option>
              <option value="link">Link</option>
              <option value="video">Video</option>
              <option value="referral_count">Referral count</option>
            </select>
          </label>

          <label>
            <span>Target / URL</span>
            <input id="target" maxlength="500" placeholder="https://t.me/...">
          </label>
        </div>

        <label class="switch-row">
          <input id="active" type="checkbox" checked>
          <span>Task is active</span>
        </label>

        <button class="btn primary" type="submit" id="saveBtn">Add Task</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-title">
        <div>
          <h2>Tasks</h2>
          <p id="taskCount">Loading…</p>
        </div>
      </div>
      <div id="taskList" class="task-list">
        <div class="empty">Loading tasks…</div>
      </div>
    </section>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
